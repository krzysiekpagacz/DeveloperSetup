---
- name: Basic setup
  hosts: all
  pre_tasks:
    - name: Remove stale Docker apt source files before any apt operation
      become: true
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/download_docker_com_linux_ubuntu.list
        - /etc/apt/sources.list.d/docker.list
        - /etc/apt/sources.list.d/docker.sources
        - "/etc/apt/sources.list.d/archive_uri-https_download_docker_com_linux_ubuntu-{{ ansible_facts.distribution_release }}.list"
  roles:
    - aws
    - cli_utils
    - docker
    - fzf
    - gcloud_cli
    - git
    - go
    - iac-tools
    - k8s
    - tmux
    - ubuntu_basics
    # vscode is intentionally not applied here: on WSL with the standard
    # Windows VS Code + Remote-WSL workflow, VS Code itself, its settings,
    # and its extensions all live outside this WSL filesystem (Windows side
    # and ~/.vscode-server, respectively). See ansible/roles/vscode/README.md.
