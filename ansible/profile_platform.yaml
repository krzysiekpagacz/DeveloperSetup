---
- name: Basic setup
  hosts: all
  roles:
    - aws
    - cli_utils
    - docker
    - fzf
    - gcloud_cli
    - git
    - go
    - iac-tools
    - k8s
    - tmux
    - ubuntu_basics
    # vscode is intentionally not applied here: on WSL with the standard
    # Windows VS Code + Remote-WSL workflow, VS Code itself, its settings,
    # and its extensions all live outside this WSL filesystem (Windows side
    # and ~/.vscode-server, respectively). See ansible/roles/vscode/README.md.
