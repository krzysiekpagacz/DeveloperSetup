---
- name: Remove legacy Google Cloud SDK apt source and key (superseded by deb822_repository below; a leftover .list here conflicts with it on Signed-By)
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/google-cloud-sdk.list
    - /usr/share/keyrings/cloud.google.gpg

- name: Add Google Cloud SDK apt repository
  become: true
  ansible.builtin.deb822_repository:
    name: google-cloud-sdk
    types: deb
    uris: https://packages.cloud.google.com/apt
    suites: cloud-sdk
    components: main
    signed_by: https://packages.cloud.google.com/apt/doc/apt-key.gpg
    state: present
    install_python_debian: true

- name: Update apt cache
  become: true
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install gcloud CLI
  become: true
  ansible.builtin.apt:
    name: google-cloud-cli
    state: latest
    install_recommends: no
  retries: 6
  delay: 10

- name: Verify gcloud installation
  ansible.builtin.command:
    cmd: gcloud --version
  register: gcloud_version
  changed_when: false

- name: Show gcloud version
  ansible.builtin.debug:
    msg: "{{ gcloud_version.stdout_lines }}"
