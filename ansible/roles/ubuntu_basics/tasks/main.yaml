---
- name: Allow sudo without password
  become: true
  ansible.builtin.lineinfile:
     path: /etc/sudoers
     state: present
     regexp: "^{{ ansible_user_id }}"
     line: "{{ ansible_user_id }} ALL=(ALL) NOPASSWD: ALL"

- name: Add fancy PS1 prompt
  ansible.builtin.blockinfile:
    path: "{{ lookup('env','HOME') }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: fancy PS1 prompt"
    block: "{{ lookup('template', 'ps1.j2') }}"

- name: Ensure useful shell aliases are present
  ansible.builtin.blockinfile:
    path: "{{ lookup('env','HOME') }}/.bash_aliases"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: ubuntu_basics aliases"
    create: yes
    block: |
      alias ll='ls -alF'
      alias la='ls -A'
      alias l='ls -CF'
      alias g='git'
      alias k='kubectl'
      alias sc='kubectx'
      alias sn='kubens'
      alias d='docker'
      alias gs='git status'
      alias gd='git diff'
      alias glog='git log --oneline --graph --decorate --all'
      alias tf='terraform'
      alias tfs='terraform state'
      alias tfp='terraform plan'
      alias tfa='terraform apply'
      alias tfc='terraform console'
      alias tfv='terraform validate'
      alias tfi='terraform init'
      alias tfm='terraform fmt'
      alias tg='terragrunt'
      alias t='tmux'
      alias ta='tmux attach -t'
      alias tls='tmux list-sessions'
      alias tn='tmux new -s'
      alias tl='tmux ls'
      alias tc='tmux new-session -s'
      alias vi='vim'
      alias h='helm'
      alias hl='helm list'
      alias ha='helm repo add'
      alias hu='helm repo update'
      alias hc='helm create'
      alias hp='helm package'
      alias hs='helm search repo'
      alias hpu='helm push'
      alias hdc='helm dependency'

