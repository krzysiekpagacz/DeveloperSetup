---
- name: Allow sudo without password
  become: true
  ansible.builtin.lineinfile:
     path: /etc/sudoers
     state: present
     regexp: "^{{ ansible_user_id }}"
     line: "{{ ansible_user_id }} ALL=(ALL) NOPASSWD: ALL"

