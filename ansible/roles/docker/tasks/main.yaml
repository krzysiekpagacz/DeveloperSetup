---
- name: Install Docker
  ansible.builtin.include_role:
    name: nickjj.docker
    apply:
      become: true
  vars:
    docker__channel: [stable]
    docker__version: ""
    docker__state: present
    docker__compose_v2_version: ""
    docker__users: ["{{ ansible_facts.user_id }}"]
    docker__daemon_flags:
      - --bip 172.30.1.1/24
      - --default-address-pool base=172.40.0.0/16,size=24

- name: Remove legacy Docker apt source (superseded by nickjj.docker's own docker.sources; a leftover .list here conflicts with it)
  become: true
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/download_docker_com_linux_ubuntu.list
    state: absent
- name: Cleanup apt-key in deprecated /etc/apt/trusted.gpg
  become: true
  ansible.builtin.command: apt-key del 0EBFCD88
  register: docker_legacy_apt_key_removed
  changed_when: "'OK' in docker_legacy_apt_key_removed.stdout"
  failed_when: false

- name: Create Docker directory
  become: true
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/docker"
    state: directory
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_id }}"
    mode: "755"

- name: Install python module for docker_network
  ansible.builtin.pip:
    name: docker==4.4.4
    virtualenv: "{{ ansible_facts.env.HOME }}/.local/bin/poetry/"

- name: Create Docker config directory
  ansible.builtin.file:
    path: "~/.docker"
    state: directory
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_id }}"
    mode: "700"

- name: Set Docker config file name
  ansible.builtin.set_fact:
    docker_config_json: "~/.docker/config.json"

- name: Check if Docker config file exists
  ansible.builtin.stat:
    path: "{{ docker_config_json }}"
  register: docker_config_json_file

- name: Initialize empty Docker config file if missing
  ansible.builtin.copy:
    dest: "{{ docker_config_json }}"
    content: "{}"
    mode: "664"
  when: not docker_config_json_file.stat.exists

- name: Backup old Docker config
  ansible.builtin.copy:
    dest: "{{ docker_config_json ~ '.backup' }}"
    src: "{{ docker_config_json }}"
    mode: "664"
  when: docker_config_json_file.stat.exists

- name: Set docker proxy config
  ansible.builtin.shell: |
    set -o pipefail
    BEFORE_MD5=$(md5sum {{ docker_config_json }})

    jq '.proxies = {"default": {"httpProxy": "http://outproxy.internal:8080", "httpsProxy": "http://outproxy.internal:8080"}}' {{ docker_config_json }} | sponge {{ docker_config_json }}

    AFTER_MD5=$(md5sum {{ docker_config_json }})
    test '"$BEFORE_MD5" == "$AFTER_MD5"' && echo "json is unchanged" || echo "json was changed"
  args:
    executable: /bin/bash
  register: result
  changed_when: '"json was changed" in result.stdout'

- name: Install Amazon ECR Docker Credential Helper
  become: true
  ansible.builtin.apt:
    name: amazon-ecr-credential-helper
    update_cache: true
    state: latest
  retries: "{{ apt__retries | default('6') }}"
  delay: "{{ apt__delay_seconds | default('10') }}"

- name: Set Docker ECR config
  ansible.builtin.shell: |
    set -o pipefail
    BEFORE_MD5=$(md5sum {{ docker_config_json }})

    jq '.credsStore = "ecr-login"' {{ docker_config_json }} | sponge {{ docker_config_json }}

    AFTER_MD5=$(md5sum {{ docker_config_json }})
    test '"$BEFORE_MD5" == "$AFTER_MD5"' && echo "json is unchanged" || echo "json was changed"
  args:
    executable: /bin/bash
  register: result
  changed_when: '"json was changed" in result.stdout'
