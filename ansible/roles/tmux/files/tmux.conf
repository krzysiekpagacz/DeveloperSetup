##### PREFIX #############################################################

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix


##### GENERAL SETTINGS #################################################

# Disable automatic window renaming
set-option -g allow-rename off

# Enable mouse control (clickable windows, panes, resizing)
set -g mouse on

# Use vi keys in copy mode
setw -g mode-keys vi


##### PANE SELECTION SHORTCUTS #########################################

bind -n M-1 select-pane -t 1
bind -n M-2 select-pane -t 2
bind -n M-3 select-pane -t 3
bind -n M-4 select-pane -t 4
bind -n M-5 select-pane -t 5
bind -n M-6 select-pane -t 6


##### DESIGN TWEAKS #####################################################

# Disable all bells and activity notifications
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# Clock mode
setw -g clock-mode-colour yellow

# Copy mode colors
setw -g mode-style 'fg=black bg=red bold'

# Pane borders
set -g pane-border-style 'fg=red'
set -g pane-active-border-style 'fg=yellow'


##### STATUS BAR ########################################################

set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=red'

set -g status-left ''
set -g status-left-length 10

# RIGHT STATUS WITH SYNC WARNING
# Shows big red "SYNC" when panes are synchronized
set -g status-right '#{?pane_synchronized,#[fg=black bg=red] SYNC #[default],} %Y-%m-%d %H:%M '
set -g status-right-style 'fg=black bg=yellow'
set -g status-right-length 50

# Window styles
setw -g window-status-current-style 'fg=black bg=red'
setw -g window-status-current-format ' #I #W #F '

setw -g window-status-style 'fg=red bg=black'
setw -g window-status-format ' #I #[fg=white]#W #[fg=yellow]#F '

setw -g window-status-bell-style 'fg=yellow bg=red bold'

# Messages
set -g message-style 'fg=yellow bg=red bold'


##### FAST PANE RESIZING #################################################

bind -r -n C-Left  resize-pane -L 5
bind -r -n C-Right resize-pane -R 5
bind -r -n C-Up    resize-pane -U 5
bind -r -n C-Down  resize-pane -D 5


##### PANE SPLIT SHORTCUTS ##############################################

# Some terminal/keyboard setups intermittently miss Shift+| after reboot.
# Keep | and add backslash as a reliable fallback on the same physical key.
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"


##### PLUGINS ###########################################################
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins"
# TPM (keep this BEFORE custom keybinds)
run '~/.tmux/plugins/tpm/tpm'


##### MULTI-PANE INPUT (SAFE) ##########################################

# Toggle "type once -> all panes"
# Use uppercase Y to avoid vi-copy / tmux-yank conflicts
bind Y set-window-option synchronize-panes


##### TMUX SHORTCUTS ###################################################

# Reload tmux config: prefix + r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"
