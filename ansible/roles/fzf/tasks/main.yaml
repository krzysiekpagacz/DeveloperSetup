---
- name: Install fzf
  become: true
  ansible.builtin.apt:
    pkg: fzf
    state: present
    update_cache: yes
  retries: 3
  delay: 10

- name: Add fzf key bindings to .bashrc
  ansible.builtin.blockinfile:
    path: "{{ lookup('env','HOME') }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: FZF key bindings"
    block: |
      # fzf key bindings
      currently_used_shell="$(readlink /proc/$$/exe | awk -F'/' '{print $NF}')"
      source /usr/share/doc/fzf/examples/key-bindings.$currently_used_shell