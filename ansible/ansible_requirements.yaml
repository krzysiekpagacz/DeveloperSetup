---
roles:
  - name: gantsign.visual-studio-code
    version: 7.0.0
    vars:
      visual_studio_code_apt_key_url: "https://packages.microsoft.com/keys/microsoft.asc"
      visual_studio_code_apt_key_path: "/usr/share/keyrings/microsoft.gpg"
      visual_studio_code_apt_repository_signed_by: "/usr/share/keyrings/microsoft.gpg"
      visual_studio_code_apt_repository_file: "vscode.list"
      visual_studio_code_apt_repository_use_sources_list: false
  - name: nickjj.docker
    version: v2.5.3

collections:
  - name: ansible.posix
    version: 2.2.1
  - name: community.general
    version: 13.1.0
  - name: kubernetes.core
    version: 6.5.0
